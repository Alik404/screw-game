<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1f5b66"/>
      <stop offset="1" stop-color="#0b2529"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ece4d0"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#e2d7bb"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="22" y="22" width="468" height="468" rx="94" fill="none" stroke="#d9a441" stroke-width="6" opacity="0.55"/>
  <!-- a fan of three cards -->
  <g filter="url(#sh)">
    <g transform="rotate(-18 256 300)">
      <rect x="166" y="132" width="150" height="212" rx="18" fill="url(#card)" stroke="#d9a441" stroke-width="5"/>
      <circle cx="241" cy="238" r="30" fill="#e2453c"/>
    </g>
    <g transform="rotate(14 256 300)">
      <rect x="200" y="124" width="150" height="212" rx="18" fill="url(#card)" stroke="#d9a441" stroke-width="5"/>
      <path d="M275 196 l30 42 -30 42 -30 -42z" fill="#3b82c4"/>
    </g>
  </g>
  <!-- a die in front -->
  <g filter="url(#sh)" transform="rotate(-10 300 352)">
    <rect x="238" y="290" width="128" height="128" rx="26" fill="url(#die)" stroke="#c9ba93" stroke-width="4"/>
    <circle cx="272" cy="324" r="12" fill="#1a1e29"/>
    <circle cx="302" cy="354" r="12" fill="#e2453c"/>
    <circle cx="332" cy="384" r="12" fill="#1a1e29"/>
  </g>
</svg>
