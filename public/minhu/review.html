<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منو هو؟ - الوجوه</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/minhu/minhu.css">
</head>
<body>
<div class="mh-sheet-grid" id="grid"></div>
<script src="/server/games/minhu/config.js"></script>
<script src="/minhu/faces.js"></script>
<script>
  MinhuFaces.ensureDefs();
  const g = document.getElementById('grid');
  MinhuConfig.CHARACTERS.forEach(function (c, i) {
    const b = document.createElement('div');
    b.className = 'mh-card bg-' + c.bg;
    b.innerHTML = '<div class="inner"><div class="front"><div class="pic">' + MinhuFaces.face(i) + '</div><div class="name">' + c.name + '</div></div><div class="back">؟</div></div>';
    g.append(b);
  });
</script>
</body>
</html>
